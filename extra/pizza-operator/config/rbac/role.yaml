---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - restaurant.example.com
  resources:
  - pizzaorders
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - restaurant.example.com
  resources:
  - pizzaorders/finalizers
  verbs:
  - update
- apiGroups:
  - restaurant.example.com
  resources:
  - pizzaorders/status
  verbs:
  - get
  - patch
  - update
